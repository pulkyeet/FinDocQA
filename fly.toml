app = "findocqa-delta"
primary_region = "sjc"

# Static deploy: build the slim web image from Dockerfile (no buildpack, no
# torch). Reports are baked into the image — no volume, no runtime secrets.
[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "8000"
