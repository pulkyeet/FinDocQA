<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Delta{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/img/delta.png?v={{ static_v('img/delta.png') }}">
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ static_v('css/tokens.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav-bar">
    <a href="/" class="nav-brand">
      <img src="/static/img/delta.png?v={{ static_v('img/delta.png') }}" alt="" class="brand-mark">
      <span class="brand-word">Delta</span>
    </a>
    <div class="nav-right">
      <a href="/" class="nav-link">All reports</a>
      {% block nav_extra %}{% endblock %}
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer">
    <img src="/static/img/delta.png?v={{ static_v('img/delta.png') }}" alt="" class="footer-mark">
    <div>Delta — Filing Change Intelligence</div>
    <span class="caption">Detection is deterministic. Interpretation is generative. Every claim traces to a diff record.</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
